<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QC Multi Tank Dashboard</title>

<!-- NO CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f4f7fb;
    padding:20px;
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:40px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:35px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.card h2{
    margin-bottom:20px;
    color:#222;
}

.chart-box{
    position:relative;
    height:450px;
}

.loader{
    text-align:center;
    padding:30px;
    font-size:18px;
    color:#666;
}

</style>

</head>

<body>

<h1>QC Tank Dashboard</h1>

<div id="loading" class="loader">
Loading Dashboard...
</div>

<!-- DENSITY -->
<div class="card">
    <h2>Density KG/M3</h2>
    <div class="chart-box">
        <canvas id="densityChart"></canvas>
    </div>
</div>

<!-- FLASH POINT -->
<div class="card">
    <h2>Flash Point °C</h2>
    <div class="chart-box">
        <canvas id="flashChart"></canvas>
    </div>
</div>

<!-- RECOVERY TEMP -->
<div class="card">
    <h2>95% Recovery Temperature</h2>
    <div class="chart-box">
        <canvas id="recoveryChart"></canvas>
    </div>
</div>

<!-- VISCOSITY -->
<div class="card">
    <h2>Viscosity CS</h2>
    <div class="chart-box">
        <canvas id="viscosityChart"></canvas>
    </div>
</div>

<!-- SULPHUR -->
<div class="card">
    <h2>Sulphur PPM</h2>
    <div class="chart-box">
        <canvas id="sulphurChart"></canvas>
    </div>
</div>

<script>

/* GOOGLE SHEET CSV */

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRFIeup4WP4MQh4zyOEi4QvjYq6b-j2jelIBfOCIiVSY5H5V_KIewWpTrrrk8Z0LSM6HvHJ7DhA_YJ-/pub?output=csv";

/* COLORS */

const colors = [
    "#ff0000",
    "#007bff",
    "#28a745",
    "#ff9900",
    "#8000ff",
    "#00bcd4",
    "#e91e63",
    "#795548"
];

/* FETCH DATA */

Papa.parse(sheetURL, {

    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(results){

        document.getElementById("loading").style.display = "none";

        const data = results.data;

        console.log(data);

        /* COLUMN NAMES */

        const tankColumn = "TANK @ MGT";

        const parameters = [
            {
                column:"DENSITY KG/M3",
                chart:"densityChart"
            },
            {
                column:"FLASH POINT C",
                chart:"flashChart"
            },
            {
                column:"95% recovery temprature",
                chart:"recoveryChart"
            },
            {
                column:"VISCOSITY CS",
                chart:"viscosityChart"
            },
            {
                column:"SULPHUR PPM",
                chart:"sulphurChart"
            }
        ];

        /* UNIQUE TANKS */

        const tanks = [...new Set(data.map(row => row[tankColumn]))];

        /* CREATE EACH GRAPH */

        parameters.forEach(param => {

            const datasets = [];

            tanks.forEach((tank,index) => {

                const tankData = data.filter(
                    row => row[tankColumn] === tank
                );

                datasets.push({

                    label:tank,

                    data:tankData.map(
                        row => parseFloat(row[param.column])
                    ),

                    borderColor:colors[index % colors.length],

                    backgroundColor:colors[index % colors.length],

                    borderWidth:3,

                    tension:0.3,

                    fill:false

                });

            });

            /* X AXIS */

            const labels = data.map(
                row => row["RECEIPT STARTED"]
            );

            /* CREATE CHART */

            new Chart(document.getElementById(param.chart), {

                type:'line',

                data:{

                    labels:labels,

                    datasets:datasets

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{
                        mode:'index',
                        intersect:false
                    },

                    plugins:{
                        legend:{
                            position:'top'
                        }
                    },

                    scales:{

                        x:{
                            title:{
                                display:true,
                                text:"Receipt Started"
                            }
                        },

                        y:{
                            title:{
                                display:true,
                                text:param.column
                            }
                        }

                    }

                }

            });

        });

    },

    error:function(err){

        console.error(err);

        alert("Failed to load Google Sheet");

    }

});

</script>

</body>
</html>
