<!DOCTYPE html>
<html>

<head>

<title>DEBUG GOOGLE SHEET</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
    font-family:Arial;
    padding:20px;
}

pre{
    background:#f4f4f4;
    padding:20px;
    border-radius:10px;
}

</style>

</head>

<body>

<h1>Google Sheet Debug</h1>

<h2>Detected Columns:</h2>

<pre id="output"></pre>

<script>

const sheetURL =
'https://docs.google.com/spreadsheets/d/1Yhd0W2uyMZxPDWQ_XaaHEvUkqvjy8AQaYe0h4XBK-mk/gviz/tq?tqx=out:csv';



Papa.parse(sheetURL,{

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        console.log(results.data);

        const firstRow = results.data[0];

        document.getElementById('output').innerText =

        JSON.stringify(firstRow,null,2);
    }
});

</script>

</body>

</html>
